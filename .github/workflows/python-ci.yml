name: python-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "configs/**"
      - "data/fixtures/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - "configs/**"
      - "data/fixtures/**"
      - "pyproject.toml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  forecasting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Build fixture data
        run: python data/fixtures/generate_synthetic_country_day.py
      - name: Run forecasting tests
        run: python -m pytest src/tests/forecasting -q
